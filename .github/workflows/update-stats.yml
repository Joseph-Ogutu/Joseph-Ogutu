name: Update Profile Stats
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create assets folder
        run: mkdir -p assets

      - name: Generate streak stats and activity graph (self-hosted, no third-party services)
        env:
          GH_USERNAME: Joseph-Ogutu
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      # These three still use third-party generators. They weren't reported
      # broken, but they carry the same shared-instance rate-limit risk as
      # streak-stats and activity-graph did. Leaving them as-is for now —
      # revisit if they start failing too.
      - name: Fetch GitHub stats card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api?username=Joseph-Ogutu&show_icons=true&theme=github_dark&include_all_commits=true&cache_seconds=86400" \
            -o assets/github-stats.svg

      - name: Fetch top languages card
        run: |
          curl -sL "https://github-readme-stats.vercel.app/api/top-langs/?username=Joseph-Ogutu&layout=compact&theme=github_dark&cache_seconds=86400" \
            -o assets/top-langs.svg

      - name: Fetch trophies card
        run: |
          curl -sL "https://github-profile-trophy.vercel.app/?username=Joseph-Ogutu&theme=algolia&column=4&margin-w=10&margin-h=10" \
            -o assets/trophies.svg

      - name: Validate downloaded cards (the third-party ones)
        run: |
          for f in assets/github-stats.svg assets/top-langs.svg assets/trophies.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "::warning::$f invalid — keeping previous version."
              git checkout -- "$f" || true
            fi
          done

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats cards"
          git push